
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SugarBayy API | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
            sans-serif;
            background: #f7f7f8;
            color: #222;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgb(0 0 0 / 5%);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
            font-weight: 700;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        label {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4d4d4;
            border-radius: 8px;
            background: #fff;
            color: #222;
            font: inherit;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #888;
            outline-offset: 1px;
            border-color: transparent;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            margin: 22px 0;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .tab {
            padding: 11px 6px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #666;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .tab.active {
            background: #fff;
            color: #222;
            font-weight: 600;
            box-shadow: 0 1px 4px rgb(0 0 0 / 10%);
        }

        .tab:focus-visible,
        .submit:focus-visible {
            outline: 2px solid #777;
            outline-offset: 3px;
        }

        .panel {
            display: grid;
            gap: 20px;
        }

        form {
            display: grid;
            gap: 10px;
        }

        .submit {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #222;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.15s ease;
        }

        .submit:hover {
            background: #444;
        }

        .message {
            padding: 11px 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .error {
            color: #a32121;
            background: #fff0f0;
            border: 1px solid #f5d0d0;
        }

        .success {
            color: #176b3a;
            background: #edfaf1;
            border: 1px solid #ccebd6;
        }

        .footer {
            margin: 24px 0 0;
            color: #888;
            font-size: 12px;
            text-align: center;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>
<main class="card">
    <h1>SugarBayy API</h1>
    <p class="subtitle">
        Sign in with your admin credentials to access API documentation.
    </p>

    <!-- Error message: render only when non-empty -->
    <div th:if="${error != null and !#strings.isEmpty(error)}"
         class="message error"
         role="alert"
         th:text="${error}">
    </div>

    <!-- Success message: render only when explicitly true -->
    <div th:if="${sent == true}"
         class="message success"
         role="status">
        Verification code sent. Check your email.
    </div>

    <!-- Authentication method tabs -->
    <div class="tabs"
         role="tablist"
         aria-label="Admin login method">

        <button
                type="button"
                id="otp-tab"
                class="tab active"
                role="tab"
                aria-selected="true"
                aria-controls="otp-panel">
            Email OTP
        </button>

        <button
                type="button"
                id="password-tab"
                class="tab"
                role="tab"
                aria-selected="false"
                aria-controls="password-panel">
            Email &amp; Password
        </button>
    </div>

    <!-- Shared email field: only one email input -->
    <div class="field">
        <label for="admin-email">Admin email</label>
        <input
                id="admin-email"
                type="email"
                autocomplete="username"
                placeholder="admin@example.com"
                required
                th:value="${email}">
    </div>

    <!-- Email OTP authentication -->
    <section
            id="otp-panel"
            class="panel"
            role="tabpanel"
            aria-labelledby="otp-tab">

        <!-- Send OTP -->
        <form
                method="post"
                action="/auth/admin/apidoc/login/email/send-otp">

            <input
                    type="hidden"
                    name="email"
                    class="email-value">

            <button class="submit" type="submit">
                Send verification code
            </button>
        </form>

        <!-- Verify OTP -->
        <form
                method="post"
                action="/auth/admin/apidoc/login/email">

            <input
                    type="hidden"
                    name="email"
                    class="email-value">

            <div class="field">
                <label for="otp-code">Verification code</label>
                <input
                        id="otp-code"
                        name="otp"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="Enter 6-digit code"
                        minlength="6"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        required>
            </div>

            <button class="submit" type="submit">
                Verify and open Swagger
            </button>
        </form>
    </section>

    <!-- Email and password authentication -->
    <section
            id="password-panel"
            class="panel"
            role="tabpanel"
            aria-labelledby="password-tab"
            hidden>

        <form
                method="post"
                action="/auth/admin/apidoc/login/credentials">

            <input
                    type="hidden"
                    name="email"
                    class="email-value">

            <div class="field">
                <label for="admin-password">Password</label>
                <input
                        id="admin-password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required>
            </div>

            <button class="submit" type="submit">
                Login and open Swagger
            </button>
        </form>
    </section>

    <p class="footer">
        Restricted access · Authorized administrators only
    </p>
</main>

<script>
    const emailInput = document.getElementById("admin-email");
    const emailFields = document.querySelectorAll(".email-value");

    const otpTab = document.getElementById("otp-tab");
    const passwordTab = document.getElementById("password-tab");

    const otpPanel = document.getElementById("otp-panel");
    const passwordPanel = document.getElementById("password-panel");

    const otpCode = document.getElementById("otp-code");
    const adminPassword = document.getElementById("admin-password");

    // Copy the shared email into the active form's hidden field.
    function syncEmail() {
        emailFields.forEach(field => {
            field.value = emailInput.value.trim();
        });
    }

    emailInput.addEventListener("input", syncEmail);

    // Validate the shared email before submitting any form.
    document.querySelectorAll("form").forEach(form => {
        form.addEventListener("submit", event => {
            syncEmail();

            if (!emailInput.reportValidity()) {
                event.preventDefault();
                emailInput.focus();
            }
        });
    });

    // Switch between OTP and password authentication.
    function switchTab(method) {
        const isOtp = method === "otp";

        otpPanel.hidden = !isOtp;
        passwordPanel.hidden = isOtp;

        otpTab.classList.toggle("active", isOtp);
        passwordTab.classList.toggle("active", !isOtp);

        otpTab.setAttribute("aria-selected", String(isOtp));
        passwordTab.setAttribute("aria-selected", String(!isOtp));

        // Only require fields in the currently active tab.
        otpCode.required = isOtp;
        adminPassword.required = !isOtp;

        // Move keyboard focus to the selected tab.
        if (isOtp) {
            otpTab.focus();
        } else {
            passwordTab.focus();
        }
    }

    otpTab.addEventListener("click", () => switchTab("otp"));
    passwordTab.addEventListener("click", () => switchTab("password"));

    // Initialize hidden fields and tab requirements.
    syncEmail();
    otpCode.required = true;
    adminPassword.required = false;
</script>
</body>
</html>
