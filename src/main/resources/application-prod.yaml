spring:
  app:
    allowed-clients: "https://www.sugarbayy.in, https://admin.sugarbayy.in, https://api.sugarbayy.in"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
oauth:
  redirect-origin: "https://www.sugarbayy.in"
logging:
  level:
    root: INFO
    com.zaxxer.hikari: WARN
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO