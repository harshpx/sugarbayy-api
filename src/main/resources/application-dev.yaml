spring:
  app:
    allowed-clients: "http://localhost:5173, http://localhost:5174, http://localhost:8087"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
oauth:
  redirect-origin: "http://localhost:5173"
logging:
  level:
    root: INFO
    com.zaxxer.hikari: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.web.cors: TRACE